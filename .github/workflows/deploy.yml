name: Deploy Viral Flux (Pages e Hostinger)

on:
  push:
    branches:
      - main

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Prepara o ambiente
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 2. Instalação (COM A CORREÇÃO DO ERRO)
      # Usamos --legacy-peer-deps para ignorar o conflito de versões do TypeScript/Angular
      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      # 3. Construção do projeto
      - name: Build do projeto
        run: npm run build

      # 4. Verificação de segurança (Ver no log se a pasta dist foi criada)
      - name: Mostrar arquivos gerados
        run: ls -al dist/

      # 5. Deploy para GitHub Pages
      - name: Deploy para GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/ # Certifique-se que seu build gera a pasta 'dist'

      # 6. Deploy para Hostinger via FTP
      - name: Deploy FTP para Hostinger 📂
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: dist/
          server-dir: / # Recomendo verificar se o correto não seria /public_html/
          dangerous-clean-slate: false # Mudei para false para sua segurança inicial
          dry-run: false
          log-level: verbose
